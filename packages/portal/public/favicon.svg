<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    SubmitStream chevron mark, optimized for favicon scale (16-32px).
    Thicker strokes than the on-screen logo so the marks read clearly
    at tiny sizes. Three primary diagonals; trailing flow lines from
    the on-screen logo are dropped because they mush together below 24px.
  -->
  <line x1="3" y1="5" x2="15" y2="23" stroke="#E8613C" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="11" y1="5" x2="23" y2="23" stroke="#E8613C" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="19" y1="5" x2="29" y2="23" stroke="#E8613C" stroke-width="3.5" stroke-linecap="round"/>
</svg>
